name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main, for the device tests: the push a merge makes skips them (the pull request
  # already ran them), so this catches anything two merges broke together. Run it by hand too.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

# A new push to a pull request supersedes its last run; a push to main never cancels one that
# has started. A run still waiting behind one is replaced by a newer push, which ships the same
# commits and more. The event is part of the group, so a nightly or manual run on main never
# replaces a waiting push (which would drop that push's deploy).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  # Lint, types and build, and the checks that aren't vitest. Every step runs even when an earlier
  # one fails, so a red build reports all of its problems in one go.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type-check
        if: ${{ !cancelled() }}
        run: pnpm check-types

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # The registry in deployments/ and the configs rendered from it.
      - name: Test fleet
        if: ${{ !cancelled() }}
        run: pnpm test:fleet

      # The Claude Code toolkit in .claude/: its skills, agents and hook wiring, and what the
      # hooks allow, ask about and deny.
      - name: Test toolkit
        if: ${{ !cancelled() }}
        run: pnpm test:toolkit

      # Known high or critical advisories in anything that ships (dev tooling excluded).
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  # `pnpm test`, split across three runners so the slowest packages don't queue behind each other:
  # the engine on its own, the content stack's three slowest, and every other package. `rest`
  # excludes exactly the packages the named shards run, so a new package is always tested.
  # Includes the engine's end-to-end Workflow runs in workerd (Durable Objects, Workflows, D1, R2)
  # with AI_MODE=mock: no network or Cloudflare account needed. Nothing is cached between runs: a
  # test task's hash doesn't cover its dependencies' source, so a cached pass could hide a break.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [engine, content, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          ENGINE: '@commerceworker/engine'
          CONTENT: '@commerceworker/studio @commerceworker/pipeline @commerceworker/store'
          # Two test tasks at a time, not turbo's ten: on the runner's 4 vCPUs, ten workerd pools at
          # once starved the catalog's Durable Object tests past their timeouts.
          TURBO_CONCURRENCY: 2
        run: |
          filters=()
          case "$SHARD" in
            engine) for p in $ENGINE; do filters+=("--filter=$p"); done ;;
            content) for p in $CONTENT; do filters+=("--filter=$p"); done ;;
            rest) for p in $ENGINE $CONTENT; do filters+=("--filter=!$p"); done ;;
            *) echo "::error::unknown test shard $SHARD"; exit 1 ;;
          esac
          pnpm exec turbo run test "${filters[@]}"

  # The check a merge waits for, and what plan (so every deploy) needs: all of the above passed.
  verify:
    needs: [checks, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every verify job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # The workflows themselves: actionlint (expressions, job graph, and shellcheck over every `run:`)
  # and zizmor (template injection, credentials, pinning, over-broad secrets and permissions).
  # zizmor's configuration is .github/zizmor.yml.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Findings in the log, not uploaded to code scanning (which would need security-events: write).
          advanced-security: false

  # Every commit a pull request adds follows Conventional Commits (commitlint.config.ts). Only the
  # PR's own range is checked, so commits from before the rule aren't held to it.
  commits:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # The SDK as npm serves it: packed, installed into an empty project, every subpath loaded as ESM
  # and CJS and type-checked, and the `commerceworker` binary run (scripts/sdk-packages.ts). It needs
  # the network for the React and Vue peers. The job always runs and always reports, so it can be a
  # required check without holding up a pull request that doesn't touch the SDK: it decides inside
  # whether the paths below changed and skips its steps if not, which GitHub counts as a success (a
  # workflow-level `paths:` filter would leave a required check pending forever).
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did the SDK's inputs change?
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/sdk/|packages/cli/|scripts/sdk-packages|apps/web/app/lib/openapi\.ts$|apps/web/app/lib/rest-operations\.ts$|packages/core/src/tool-schemas\.ts$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.changed.outputs.run == 'true'
      - name: Pack
        if: steps.changed.outputs.run == 'true'
        run: pnpm sdk:pack
      - name: Check
        if: steps.changed.outputs.run == 'true'
        run: pnpm sdk:check
  # Whether the device tests need to run: always, except for a pull request that touches only
  # docs (docs/, apps/docs/), the marketing site (apps/marketing/), the Claude Code toolkit
  # (.claude/) or top-level Markdown, none of which the web app or the storefront serves. A rename
  # counts its old path too. Not on a push to main: the pull request already ran them.
  changes:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      devices: ${{ steps.files.outputs.devices }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "devices=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files"
          count=$(wc -l < "$RUNNER_TEMP/files")
          # The API lists at most 3,000 files; past that, run everything.
          if [ "$count" -ge 3000 ] || grep -qvE '^(docs/|apps/docs/|apps/marketing/|\.claude/|[^/]+\.md$)' "$RUNNER_TEMP/files"; then
            echo "devices=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only docs, marketing, toolkit or Markdown changed ($count files): device tests skipped"
            echo "devices=false" >> "$GITHUB_OUTPUT"
          fi

  # The web app and the storefront in WebKit as an iPhone and an iPad, both ways up, and a desktop:
  # layout, safe areas, touch targets and the on-screen keyboard (apps/web/e2e, apps/storefront/e2e).
  # The dev servers run offline (mock AI, no remote bindings, their own databases), so no Cloudflare
  # account is needed. The admin's suite is split four ways with Playwright's --shard, and the
  # storefront's runs beside it: each job has its own dev server, still running one test at a time
  # (playwright.config.ts), so splitting changes nothing a test sees.
  # On ubuntu-latest (26.04) like every other job: Playwright 1.64 ships WebKit built for 26.04. The
  # cache key below includes the Ubuntu release, so a build for one image is never loaded on another
  # (an older WebKit linked 24.04's ICU and couldn't start on 26.04).
  device-tests:
    name: devices (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.devices == 'true' }}
    runs-on: ubuntu-latest
    # Up to 15 minutes for the system libraries when the mirror is slow (5, then a 10 minute
    # retry), and the device tests' own 15: a slow mirror never eats the tests' time.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web 1/4, app: web, shard: 1/4, id: web-1 }
          - { name: web 2/4, app: web, shard: 2/4, id: web-2 }
          - { name: web 3/4, app: web, shard: 3/4, id: web-3 }
          - { name: web 4/4, app: web, shard: 4/4, id: web-4 }
          - { name: storefront, app: storefront, shard: '', id: storefront }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The browser download is cached by Playwright version and Ubuntu release (a build for one
      # release can't load another's system libraries), so it is fetched only on a miss. The
      # system libraries come from apt, which the runner's Ubuntu mirror sometimes serves very
      # slowly (two runs spent all 25 minutes there, and one spent 13 on both attempts, leaving the
      # tests too little), so that step has its own short timeout and one retry, and the tests
      # have their own budget after it.
      - name: Resolve the Playwright version
        id: playwright
        # `pnpm exec` can print more than Playwright's one line, and a line without `key=` breaks
        # $GITHUB_OUTPUT: take the first version number and fail if there is none.
        run: |
          version=$(pnpm --filter @commerceworker/web exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: Cache WebKit
        id: webkit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}
      - name: Download WebKit
        if: ${{ steps.webkit.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        run: pnpm --filter @commerceworker/web exec playwright install webkit
      - name: Install WebKit system dependencies
        id: deps
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm --filter @commerceworker/web exec playwright install-deps webkit
      # A timed-out first attempt kills pnpm but can leave its apt-get running with the dpkg lock
      # held; wait for it to finish (it often completes the install) before trying again.
      - name: Install WebKit system dependencies (retry)
        if: ${{ steps.deps.outcome == 'failure' }}
        timeout-minutes: 10
        run: |
          while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do
            echo "Waiting for the first attempt's apt-get to release the dpkg lock"
            sleep 5
          done
          pnpm --filter @commerceworker/web exec playwright install-deps webkit
      - name: Device tests
        timeout-minutes: 15
        env:
          APP: ${{ matrix.app }}
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter "@commerceworker/$APP" exec playwright test ${SHARD:+"--shard=$SHARD"}
      # A failure's traces (DOM, network, console at each step): open with `playwright show-trace`.
      - name: Keep the failures' traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-traces-${{ matrix.id }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7

  # One check for all the device-test jobs: red if any failed or was cancelled, green when they
  # passed or a docs-only pull request skipped them.
  devices:
    needs: [changes, device-tests]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every device-test job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The fleet: every deployment in deployments/, grouped by ring. Each ring waits for the one
  # before it to finish cleanly; an empty ring is skipped. See docs/operations.md. A ring after
  # staging runs past a skipped one (`!failure()`), so it also needs plan to have run: on a pull
  # request plan is skipped, its outputs are empty, and the ring's matrix couldn't be built.
  # Deploys are off until the repository variable DEPLOY_ENABLED is `true` (Settings → Secrets and
  # variables → Actions → Variables). Without it a push to main still runs verify, and every ring
  # below is skipped, since each needs this job.
  # Each ring hands deploy.yml its secrets with `secrets: inherit`. Its job reads its environment's
  # secrets either way; inherit is for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID when they are
  # repository secrets. Naming those two instead makes actionlint reject every environment secret
  # deploy.yml reads, so keep the repository's own secrets to those two.
  plan:
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging: ${{ steps.rings.outputs.staging }}
      internal: ${{ steps.rings.outputs.internal }}
      canary: ${{ steps.rings.outputs.canary }}
      general: ${{ steps.rings.outputs.general }}
      deployments: ${{ steps.rings.outputs.deployments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: rings
        run: |
          rings=$(node scripts/fleet.ts matrix)
          # Each ring is a list of ids (so its jobs are named by id); `deployments` maps an id to
          # its entry.
          for ring in staging internal canary general; do
            echo "$ring=$(jq -c --arg r "$ring" '[.[$r][].id]' <<<"$rings")" >> "$GITHUB_OUTPUT"
          done
          echo "deployments=$(jq -c '[.[][]] | map({key: .id, value: .}) | from_entries' <<<"$rings")" >> "$GITHUB_OUTPUT"

  staging:
    needs: plan
    if: needs.plan.outputs.staging != '[]'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.staging) }}
    name: staging
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit # zizmor: ignore[secrets-inherit] (see plan)

  internal:
    needs: [plan, staging]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.internal != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.internal) }}
    name: internal
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit # zizmor: ignore[secrets-inherit] (see plan)

  canary:
    needs: [plan, internal]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.canary != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.canary) }}
    name: canary
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit # zizmor: ignore[secrets-inherit] (see plan)

  general:
    needs: [plan, canary]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.general != '[]' }}
    strategy:
      fail-fast: false
      # Customers in the general ring deploy a few at a time.
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.general) }}
    name: general
    uses: ./.github/workflows/deploy.yml
    with:
      deployment: ${{ toJSON(fromJSON(needs.plan.outputs.deployments)[matrix.id]) }}
    secrets: inherit # zizmor: ignore[secrets-inherit] (see plan)
