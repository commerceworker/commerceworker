name: Deploy

# Ships main to one deployment of the fleet (deployments/<id>.jsonc). CI calls this once per
# deployment, ring by ring; see docs/operations.md.
on:
  workflow_call:
    inputs:
      deployment:
        description: One deployment from `node scripts/fleet.ts matrix`, as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Plugin code runs here, and only here: building each plugin and reading its manifest (its
  # src/manifest.ts, and whatever that imports) executes code that isn't the core's. This job has
  # no environment, so none of the deployment's secrets, and no Cloudflare token; the deploy job
  # takes only the bundles and manifests it produces.
  plugin-bundles:
    name: ${{ fromJSON(inputs.deployment).id }} (plugins)
    if: ${{ fromJSON(inputs.deployment).plugins && toJSON(fromJSON(inputs.deployment).plugins) != '{}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build plugin bundles
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          mkdir -p out
          for p in $(jq -r '.plugins // {} | keys[]' <<<"$DEPLOYMENT"); do
            sha=$(node scripts/plugin-bundle.ts "plugins/$p" "out/bundle-$p.json" "out/manifest-$p.json")
            echo "$p $sha" >> out/bundles
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-bundles-${{ fromJSON(inputs.deployment).id }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: ${{ fromJSON(inputs.deployment).id }}
    needs: plugin-bundles
    # Also when there are no plugins (plugin-bundles skipped), never after it failed.
    if: ${{ !cancelled() && (needs.plugin-bundles.result == 'success' || needs.plugin-bundles.result == 'skipped') }}
    runs-on: ubuntu-latest
    # The deploys, the Smoke test step's 28 minutes at most, and the rollback after it. A deployment
    # with the content stack (`content`) has five more Workers to build and deploy and its own smoke
    # step of up to 20 minutes, so the limit is the same for every deployment: a commerce-only one
    # is bounded by the steps' own timeouts long before it.
    timeout-minutes: 75
    # The deployment's GitHub environment holds its secrets (PRINCIPAL_KEY and DATA_KEY, required,
    # and PRINCIPAL_KEY_PREVIOUS and DATA_KEY_PREVIOUS during a rotation; SETUP_TOKEN, SHOPIFY_WEBHOOK_SECRET,
    # STRIPE_WEBHOOK_SECRET, OIDC_CLIENT_SECRET, INTAKE_ALLOWLIST, SHIPPING_CARRIER_AUTH, STRIPE_SECRET_KEY,
    # UCP_SIGNING_KEY; with the content stack also TOKEN_PEPPER and MEDIA_SIGNING_SECRET, required,
    # and STREAM_WEBHOOK_SECRET, MCP_TOKEN and ADMIN_TOKEN; and each installed plugin's
    # PLUGIN_<ID>_<NAME>, docs/plugins.md) and, if it should, a required reviewer.
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID can be repository secrets.
    environment:
      name: ${{ fromJSON(inputs.deployment).environment }}
      url: https://${{ fromJSON(inputs.deployment).domain }}
    concurrency:
      group: deploy-${{ fromJSON(inputs.deployment).id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ID: ${{ fromJSON(inputs.deployment).id }}
      DOMAIN: ${{ fromJSON(inputs.deployment).domain }}
      CATALOG_DOMAIN: ${{ fromJSON(inputs.deployment).catalogDomain }}
      STOREFRONT_DOMAIN: ${{ fromJSON(inputs.deployment).storefrontDomain }}
      # The content stack: `true` for a deployment whose registry entry has "content": true, which
      # also deploys the pipeline, media, api and studio Workers and delivery's content side. The
      # hosts are empty without it.
      CONTENT: ${{ fromJSON(inputs.deployment).content }}
      STUDIO_DOMAIN: ${{ fromJSON(inputs.deployment).studioDomain }}
      API_DOMAIN: ${{ fromJSON(inputs.deployment).apiDomain }}
      CDN_DOMAIN: ${{ fromJSON(inputs.deployment).cdnDomain }}
      MEDIA_DOMAIN: ${{ fromJSON(inputs.deployment).mediaDomain }}
      # Rendered next to each app's wrangler.jsonc by the Render step.
      CONFIG: wrangler.${{ fromJSON(inputs.deployment).id }}.json
    # The Cloudflare API sometimes fails a request outright (codes 7403, 10013) and succeeds on
    # the next try. Each step below is idempotent, so `retry` runs it up to three times; without
    # it a blip between the engine and web steps leaves the deployment running mismatched Workers.
    defaults:
      run:
        shell: bash
    steps:
      # A merge that silently skips its deploy looks like a deploy: fail instead.
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set to deploy"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install retry helper
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/retry" <<'SH'
          #!/usr/bin/env bash
          for attempt in 1 2 3; do
            "$@" && exit 0
            echo "::warning::attempt $attempt failed: $*"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          exit 1
          SH
          chmod +x "$HOME/.local/bin/retry"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render config
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          node scripts/fleet.ts render "$ID"
          # Installed plugins (plugins/<id>/), space-separated; empty for most deployments. Worker
          # plugins are deployed as their own Workers; sandboxed ones are bundles the engine loads.
          # shellcheck disable=SC2016 # $r is jq's, not the shell's
          runtime='.plugins // {} | to_entries | map(select((.value.runtime // "worker") == $r) | .key) | sort | join(" ")'
          {
            echo "PLUGINS=$(jq -r --arg r worker "$runtime" <<<"$DEPLOYMENT")"
            echo "SANDBOXED_PLUGINS=$(jq -r --arg r sandboxed "$runtime" <<<"$DEPLOYMENT")"
            # A deployment on its own Cloudflare account keeps plugin secrets in its Secrets Store.
            echo "SECRETS_STORE=$(jq -r '.secretsStore.storeId // ""' <<<"$DEPLOYMENT")"
          } >> "$GITHUB_ENV"
      # Only the secrets set in the environment; `--secrets-file` adds to a Worker's secrets and
      # never removes one, so a secret set by hand survives.
      - name: Collect secrets
        env:
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
          PRINCIPAL_KEY_PREVIOUS: ${{ secrets.PRINCIPAL_KEY_PREVIOUS }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_KEY_PREVIOUS: ${{ secrets.DATA_KEY_PREVIOUS }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          SHOPIFY_SHOPS: ${{ secrets.SHOPIFY_SHOPS }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          INTAKE_ALLOWLIST: ${{ secrets.INTAKE_ALLOWLIST }}
          SHIPPING_CARRIER_AUTH: ${{ secrets.SHIPPING_CARRIER_AUTH }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          UCP_SIGNING_KEY: ${{ secrets.UCP_SIGNING_KEY }}
        run: |
          node scripts/fleet.ts secrets engine "$RUNNER_TEMP/engine-secrets.json" "$ID"
          node scripts/fleet.ts secrets storefront "$RUNNER_TEMP/storefront-secrets.json" "$ID"
          node scripts/fleet.ts secrets web "$RUNNER_TEMP/web-secrets.json" "$ID"
      # The content stack's Workers, each with only its own secrets. The pipeline gets the
      # assistant's keys derived from PRINCIPAL_KEY (never the key itself). A content deployment
      # also needs TOKEN_PEPPER and MEDIA_SIGNING_SECRET: without them the deploy stops here,
      # before anything is migrated.
      - name: Collect content secrets
        if: fromJSON(inputs.deployment).content
        env:
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
          PRINCIPAL_KEY_PREVIOUS: ${{ secrets.PRINCIPAL_KEY_PREVIOUS }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_KEY_PREVIOUS: ${{ secrets.DATA_KEY_PREVIOUS }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          STREAM_WEBHOOK_SECRET: ${{ secrets.STREAM_WEBHOOK_SECRET }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          for app in pipeline media api delivery studio; do
            node scripts/fleet.ts secrets "$app" "$RUNNER_TEMP/$app-secrets.json" "$ID"
          done
      # Each Worker plugin gets its own key, derived from PRINCIPAL_KEY (never the key itself), and
      # the environment's PLUGIN_<ID>_* secrets under their own names; sandboxed plugins' secrets
      # go to the engine as PLUGIN_SECRETS. With a Secrets Store, plugin secrets are bound from it
      # instead. Plugin secrets aren't listed one by one, so only this step, and only with plugins
      # installed, sees all of them.
      - name: Collect plugin secrets
        if: env.PLUGINS != '' || env.SANDBOXED_PLUGINS != ''
        env:
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
          PRINCIPAL_KEY_PREVIOUS: ${{ secrets.PRINCIPAL_KEY_PREVIOUS }}
          ENV_SECRETS: ${{ toJSON(secrets) }}
        run: |
          for p in $PLUGINS; do
            node scripts/fleet.ts secrets plugin "$RUNNER_TEMP/plugin-$p-secrets.json" "$p" "$ID"
          done
          node scripts/fleet.ts secrets sandboxed "$RUNNER_TEMP/engine-secrets.json" "$ID"
      # The plugin-bundles job's output: no plugin code runs in this job, which holds the secrets.
      - name: Fetch plugin bundles
        if: env.PLUGINS != '' || env.SANDBOXED_PLUGINS != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-bundles-${{ fromJSON(inputs.deployment).id }}
          path: ${{ runner.temp }}/plugins
      # Before anything deploys: each plugin's manifest (as the plugin-bundles job read it) is
      # checked against what the deployment has, so a missing secret stops the deploy here rather
      # than failing the smoke test.
      - name: Check plugin secrets
        if: env.PLUGINS != '' || env.SANDBOXED_PLUGINS != ''
        env:
          ENV_SECRETS: ${{ toJSON(secrets) }}
        run: |
          if [ -n "$SECRETS_STORE" ]; then
            # Names only. Listing a store needs the token's Account Secrets Store Read (Edit to
            # deploy a Worker that binds one).
            if ! names=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores/$SECRETS_STORE/secrets?per_page=100" \
              | jq -c '[.result[].name]'); then
              echo "::error::Can't list Secrets Store $SECRETS_STORE: CLOUDFLARE_API_TOKEN needs Account Secrets Store Edit"
              exit 1
            fi
            export STORE_SECRET_NAMES="$names"
          fi
          for p in $PLUGINS $SANDBOXED_PLUGINS; do
            node scripts/fleet.ts check-plugin-secrets "$ID" "$p" "$RUNNER_TEMP/plugins/manifest-$p.json"
          done
      # The restore point for this deploy: a migration can't be rolled back, but D1 Time Travel
      # can restore the database to this bookmark (docs/deploy.md, "Restoring D1").
      - name: Record D1 bookmark
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $CONFIG and $RUNNER_TEMP
          retry bash -c 'pnpm --filter @commerceworker/web exec wrangler d1 time-travel info DB --json --config "$CONFIG" > "$RUNNER_TEMP/d1-bookmark.json"'
          bookmark=$(jq -er .bookmark "$RUNNER_TEMP/d1-bookmark.json")
          echo "D1 bookmark for $ID before ${GITHUB_SHA::7}: \`$bookmark\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::D1 bookmark for $ID before this deploy: $bookmark"
      # The content database's restore point, as above (its own D1 Time Travel bookmark). Read through
      # the pipeline's config, whose DB binding is the content database.
      - name: Record content D1 bookmark
        if: fromJSON(inputs.deployment).content
        run: |
          # shellcheck disable=SC2016 # the inner shell expands $CONFIG and $RUNNER_TEMP
          retry bash -c 'pnpm --filter @commerceworker/pipeline exec wrangler d1 time-travel info DB --json --config "$CONFIG" > "$RUNNER_TEMP/content-d1-bookmark.json"'
          bookmark=$(jq -er .bookmark "$RUNNER_TEMP/content-d1-bookmark.json")
          echo "Content D1 bookmark for $ID before ${GITHUB_SHA::7}: \`$bookmark\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Content D1 bookmark for $ID before this deploy: $bookmark"
      # Migrations run before the new code, and old code runs against the new schema until the
      # Workers below are live: a migration must be additive (expand), and a destructive one
      # (contract) ships in a later change, once no deployed code needs what it removes.
      - name: Migrate D1
        run: retry pnpm --filter @commerceworker/web exec wrangler d1 migrations apply DB --remote --config "$CONFIG"
      # The content database is its own, migrated from packages/store/migrations (the commerce
      # one from packages/db/migrations above), under the same expand-only rule. The pipeline's
      # config carries its migrations_dir.
      - name: Migrate content D1
        if: fromJSON(inputs.deployment).content
        run: retry pnpm --filter @commerceworker/pipeline exec wrangler d1 migrations apply DB --remote --config "$CONFIG"
      # A demo carries the demo data (INSERT OR IGNORE: loading it again changes nothing).
      - name: Load demo data
        if: fromJSON(inputs.deployment).demo
        run: retry pnpm --filter @commerceworker/web exec wrangler d1 execute DB --remote --config "$CONFIG" --file ../../packages/db/seed/0001_demo.sql
      # The catalog has no secrets and no callers yet; it goes first so the Workers that will bind
      # to it always find the version they expect.
      - name: Deploy catalog
        id: catalog
        run: retry pnpm --filter @commerceworker/catalog exec wrangler deploy --config "$CONFIG"
      # The content stack, in dependency order. The pipeline first: it owns every content Durable
      # Object and Workflow class, which the api, delivery and studio bind by its script name. Then
      # media, so it already verifies the signed URLs the api and delivery hand out, and the api.
      # Delivery (content side) and the studio follow below. The embeds the bundles import
      # (gitignored) are generated first.
      - name: Generate embeds
        if: fromJSON(inputs.deployment).content
        run: pnpm generate
      - name: Deploy pipeline
        id: pipeline
        if: fromJSON(inputs.deployment).content
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/pipeline-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/pipeline-secrets.json")
          retry pnpm --filter @commerceworker/pipeline exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Deploy media
        id: media
        if: fromJSON(inputs.deployment).content
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/media-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/media-secrets.json")
          retry pnpm --filter @commerceworker/media exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      - name: Deploy api
        id: api
        if: fromJSON(inputs.deployment).content
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/api-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/api-secrets.json")
          retry pnpm --filter @commerceworker/api exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      # The delivery Worker: the public catalog API at catalog.<domain>, reading what the catalog
      # publishes (apps/delivery/wrangler.catalog.jsonc), and it consumes the purge queue the
      # catalog sends to. With the content stack it is the dispatcher instead (src/index.ts), which
      # adds the content API at cdn.<domain> and its bindings (the pipeline's Durable Objects, the
      # content database), so it follows the pipeline above. Its secrets are the content stack's.
      - name: Deploy delivery
        id: delivery
        run: |
          secrets=()
          if [ "$CONTENT" = true ] && [ "$(cat "$RUNNER_TEMP/delivery-secrets.json")" != "{}" ]; then
            secrets=(--secrets-file "$RUNNER_TEMP/delivery-secrets.json")
          fi
          retry pnpm --filter @commerceworker/delivery exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      # Each plugin's own D1 migrations, then its Worker: the engine and the web Worker bind to it,
      # so it goes before them. Like the core's, a plugin's migrations must be additive. Each one
      # deployed is listed, so a failure rolls it back with the rest.
      - name: Deploy plugins
        id: plugins
        if: env.PLUGINS != ''
        run: |
          for p in $PLUGINS; do
            retry pnpm --filter "./plugins/$p" exec wrangler d1 migrations apply DB --remote --config "$CONFIG"
            retry pnpm --filter "./plugins/$p" exec wrangler deploy --config "$CONFIG" --secrets-file "$RUNNER_TEMP/plugin-$p-secrets.json"
            echo "$p" >> "$RUNNER_TEMP/plugins-deployed"
          done
      # Each sandboxed plugin's bundle goes to the deployment's DOCS bucket under its sha, and the
      # engine's config pins those shas (PLUGIN_BUNDLES): the engine loads only what CI built and
      # checked. Bundles are never removed here, so rolling the engine back restores its pins.
      - name: Publish sandboxed plugins
        id: sandboxed
        if: env.SANDBOXED_PLUGINS != ''
        run: |
          eval "$(node scripts/fleet.ts names "$ID")"
          pins='{}'
          for p in $SANDBOXED_PLUGINS; do
            bundle="$RUNNER_TEMP/plugins/bundle-$p.json"
            sha=$(awk -v p="$p" '$1 == p { print $2 }' "$RUNNER_TEMP/plugins/bundles")
            # The name is the content's hash: checked again here, so the pin names these bytes.
            [ "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::$p bundle doesn't hash to $sha"; exit 1; }
            # A bundle already published under this sha is left as it is: the bucket locks plugins/
            # (provision.sh), so it can't be overwritten, and the same name means the same bytes.
            # Those bytes are checked too, so a pin never names anything else.
            stored="$RUNNER_TEMP/plugins/stored-$p.json"
            # shellcheck disable=SC2086 # the jurisdiction flag is two words, or none
            if pnpm --filter @commerceworker/engine exec wrangler r2 object get "$R2/plugins/$p/$sha.json" \
              --file "$stored" --remote ${JURISDICTION:+--jurisdiction $JURISDICTION} >/dev/null 2>&1; then
              [ "$(sha256sum "$stored" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::The stored $p bundle doesn't hash to $sha"; exit 1; }
              echo "$p bundle $sha is already published"
            else
              # shellcheck disable=SC2086
              retry pnpm --filter @commerceworker/engine exec wrangler r2 object put "$R2/plugins/$p/$sha.json" \
                --file "$bundle" --content-type application/json --remote ${JURISDICTION:+--jurisdiction $JURISDICTION}
            fi
            pins=$(jq -c --arg p "$p" --arg s "$sha" '. + {($p): $s}' <<<"$pins")
          done
          config="apps/engine/$CONFIG"
          jq --arg b "$pins" '.vars.PLUGIN_BUNDLES = $b' "$config" > "$config.tmp" && mv "$config.tmp" "$config"
          echo "Sandboxed plugins pinned: $pins" >> "$GITHUB_STEP_SUMMARY"
      # The web Worker binds to the engine, so the engine goes first.
      - name: Deploy engine
        id: engine
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/engine-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/engine-secrets.json")
          retry pnpm --filter @commerceworker/engine exec wrangler deploy --config "$CONFIG" "${secrets[@]}"
      # The storefront binds the engine's StorefrontApi (buyers' pages, UCP), so it follows it. Its
      # only secrets are the keys derived from PRINCIPAL_KEY for it (never the key itself), and
      # nothing the web app deploys depends on it.
      - name: Build storefront
        run: COMMERCEWORKER_WRANGLER_CONFIG="$CONFIG" pnpm --filter @commerceworker/storefront build
      # `wrangler deploy` picks up the build's own config (.wrangler/deploy), made from $CONFIG.
      - name: Deploy storefront
        id: storefront
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/storefront-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/storefront-secrets.json")
          retry pnpm --filter @commerceworker/storefront exec wrangler deploy "${secrets[@]}"
      - name: Build web
        run: COMMERCEWORKER_WRANGLER_CONFIG="$CONFIG" pnpm --filter @commerceworker/web build
      # `wrangler deploy` picks up the build's own config (.wrangler/deploy), made from $CONFIG.
      - name: Deploy web
        id: web
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/web-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/web-secrets.json")
          retry pnpm --filter @commerceworker/web exec wrangler deploy "${secrets[@]}"
      # The studio fronts the api and delivery over service bindings, so it goes after both.
      - name: Build studio
        if: fromJSON(inputs.deployment).content
        run: COMMERCEWORKER_STUDIO_WRANGLER_CONFIG="$CONFIG" pnpm --filter @commerceworker/studio build
      # `wrangler deploy` picks up the build's own config (.wrangler/deploy), made from $CONFIG.
      - name: Deploy studio
        id: studio
        if: fromJSON(inputs.deployment).content
        run: |
          secrets=()
          [ "$(cat "$RUNNER_TEMP/studio-secrets.json")" != "{}" ] && secrets=(--secrets-file "$RUNNER_TEMP/studio-secrets.json")
          retry pnpm --filter @commerceworker/studio exec wrangler deploy "${secrets[@]}"
      # A new domain's certificate can take a few minutes to issue, so each check retries for up
      # to five minutes before it counts as failed, a request at most 20 s: each curl ends within
      # about 5 min 20 s and the write check within 5 min, under 27 min for the five. The step's own
      # timeout fails it (and so rolls the deploy back) if anything still hangs; the job's
      # timeout leaves room for the deploys before it and the rollback after, since a job that
      # times out is cancelled and skips the rollback.
      # The write check signs with a key derived from PRINCIPAL_KEY (scripts/fleet.ts write-check),
      # inside node: the key and the header stay out of the command line and the log.
      - name: Smoke test
        id: smoke
        timeout-minutes: 28
        env:
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
        run: |
          curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$DOMAIN/health"
          # D1, R2 and the engine (over the service binding) all answer.
          curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$DOMAIN/health/deep"
          # And they take writes: D1 from the web app and the engine, R2 under health/, the engine's
          # and the catalog's Durable Object storage and the catalog's bucket, each written, read
          # back and deleted. Tries for five minutes in all, ten seconds an attempt; a failure names
          # the store.
          node scripts/fleet.ts write-check "$ID"
          # The app itself, not just the health route: the sign-in page renders.
          # (On a workspace with no people yet it redirects to the setup page, which must render too.)
          curl -fsSL --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 -o /dev/null "https://$DOMAIN/login"
          # The public catalog API answers on its own host.
          curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$CATALOG_DOMAIN/health"
          # The storefront answers on its own host, and reaches the engine (it binds nothing else).
          curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$STOREFRONT_DOMAIN/health"
          curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "https://$STOREFRONT_DOMAIN/health/deep"
      # The content stack's own smoke test, after the commerce one. The studio renders its sign-in
      # (or setup) page and reaches the api and delivery; the api serves its OpenAPI document; the
      # media origin serves nothing it wasn't told to (an unknown asset is a 404); delivery refuses
      # an anonymous read (auth runs before its cache).
      - name: Smoke test content
        id: smoke-content
        if: fromJSON(inputs.deployment).content
        timeout-minutes: 20
        run: |
          get() { curl -fsS --max-time 20 --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "$@"; }
          get "https://$STUDIO_DOMAIN/health"
          get "https://$STUDIO_DOMAIN/health/deep"
          get -L -o /dev/null -H 'Accept: text/html' "https://$STUDIO_DOMAIN/login"
          get "https://$API_DOMAIN/health"
          get -o /dev/null "https://$API_DOMAIN/openapi.json"
          get "https://$CDN_DOMAIN/health"
          get "https://$MEDIA_DOMAIN/health"
          status=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://$MEDIA_DOMAIN/smoke/main/none/v1/o/none")
          [ "$status" = 404 ] || { echo "::error::an unknown media URL answered $status, not 404"; exit 1; }
          status=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://$CDN_DOMAIN/delivery/smoke/main/entries")
          [ "$status" = 401 ] || { echo "::error::an anonymous delivery read answered $status, not 401"; exit 1; }
      # A latency budget on the deployed app, once it is up. It warns rather than fails: a slow
      # runner or network blip must not roll production back. The best of three runs counts, so a
      # cold start alone doesn't trip it.
      - name: Latency check
        continue-on-error: true
        run: |
          check() {
            local url=$1 budget=$2 best=999
            for _ in 1 2 3; do
              t=$(curl -fsSL -o /dev/null -w '%{time_total}' "$url") || continue
              best=$(awk -v a="$t" -v b="$best" 'BEGIN { print (a < b) ? a : b }')
            done
            echo "$url: ${best}s (budget ${budget}s)"
            if awk -v a="$best" -v b="$budget" 'BEGIN { exit !(a > b) }'; then
              echo "::warning title=Latency budget::$url took ${best}s, over its ${budget}s budget"
            fi
          }
          check "https://$DOMAIN/login" 1.5
          check "https://$DOMAIN/health/deep" 1.0
          check "https://$CATALOG_DOMAIN/health" 0.5
          check "https://$STOREFRONT_DOMAIN/health/deep" 1.0
          if [ "$CONTENT" = true ]; then
            check "https://$STUDIO_DOMAIN/login" 1.5
            check "https://$CDN_DOMAIN/health" 0.5
          fi
      # Any failure once the catalog has shipped puts each Worker that deployed back on its
      # previous version: the engine, then the storefront and the web app, the plugins, delivery
      # and the catalog; and with the content stack the pipeline first, then the studio, api and
      # media (delivery is in the list above).
      # The engine goes first because it is the one that can refuse (Cloudflare won't roll a Worker
      # back past a Durable Object migration). If it can't go back, nothing else is rolled back
      # either: the storefront, web app, plugins and catalog stay on the versions the new engine was
      # deployed with, so the deployment never runs a new engine behind an old web app, and the step fails
      # with an error for a person to decide. A Worker's first deploy has no earlier version, which
      # wrangler reports as "Could not find stable Worker Version to rollback to": that one stays as
      # it is. Any other rollback failure is an error, after the rest are rolled back. The job ends
      # failed either way, from the step that failed. D1 migrations are not rolled back, which is
      # why they must be additive.
      - name: Roll back on a failed deploy
        if: failure() && steps.catalog.outcome == 'success'
        env:
          ENGINE: ${{ steps.engine.outcome }}
          STOREFRONT: ${{ steps.storefront.outcome }}
          WEB: ${{ steps.web.outcome }}
          DELIVERY: ${{ steps.delivery.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          MEDIA: ${{ steps.media.outcome }}
          API: ${{ steps.api.outcome }}
          STUDIO: ${{ steps.studio.outcome }}
        run: |
          msg="Deploy failed for ${GITHUB_SHA::7}"
          # rollback <name> <pnpm filter>: 0 rolled back, 2 no earlier version, 1 failed. Retries
          # like `retry`, except a first deploy: asking again won't find an earlier version.
          rollback() {
            local name=$1 filter=$2 out attempt
            for attempt in 1 2 3; do
              if out=$(pnpm --filter "$filter" exec wrangler rollback -y -m "$msg" --config "$CONFIG" </dev/null 2>&1); then
                printf '%s\n' "$out"
                echo "Rolled back $name" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              printf '%s\n' "$out"
              if grep -q 'Could not find stable Worker Version to rollback to' <<<"$out"; then
                echo "::notice::$name has no earlier version (its first deploy), so it stays as it is"
                echo "Left $name as it is: no earlier version" >> "$GITHUB_STEP_SUMMARY"
                return 2
              fi
              echo "::warning::attempt $attempt to roll back $name failed"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
            done
            echo "::error::$name could not be rolled back; it is still on ${GITHUB_SHA::7}"
            echo "**Failed to roll back $name**" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }
          failed=0
          engine=0
          if [ "$ENGINE" = success ]; then
            rollback engine @commerceworker/engine || engine=$?
            if [ "$engine" = 1 ]; then
              echo "::error::The engine could not be rolled back (a Durable Object migration since its last version, for one, prevents it), so the storefront, web app, plugins and catalog were left on ${GITHUB_SHA::7} to match it. Fix forward, or roll back by hand once the cause is known."
              failed=1
            fi
          fi
          # The content stack has its own engine, the pipeline, with the same rule: the api, media,
          # delivery and studio bind its Durable Objects, so if it can't go back they stay on
          # ${GITHUB_SHA::7} with it. The commerce Workers don't depend on it, so each stack is
          # decided on its own.
          pipeline=0
          if [ "$PIPELINE" = success ]; then
            rollback pipeline @commerceworker/pipeline || pipeline=$?
            if [ "$pipeline" = 1 ]; then
              echo "::error::The pipeline could not be rolled back (a Durable Object migration since its last version, for one, prevents it), so the api, media, delivery and studio were left on ${GITHUB_SHA::7} to match it. Fix forward, or roll back by hand once the cause is known."
              failed=1
            fi
          fi
          # The storefront and the web app follow the engine: back only if the engine went back (or
          # never deployed).
          if [ "$engine" != 1 ]; then
            if [ "$STOREFRONT" = success ] && [ "$engine" = 0 ]; then
              rollback storefront @commerceworker/storefront || [ $? = 2 ] || failed=1
            fi
            if [ "$WEB" = success ] && [ "$engine" = 0 ]; then
              rollback web @commerceworker/web || [ $? = 2 ] || failed=1
            fi
            if [ -f "$RUNNER_TEMP/plugins-deployed" ]; then
              while read -r p; do
                rollback "plugin $p" "./plugins/$p" || [ $? = 2 ] || failed=1
              done <"$RUNNER_TEMP/plugins-deployed"
            fi
          fi
          # The studio, api and media follow the pipeline, in reverse of their deploy order.
          if [ "$pipeline" = 0 ]; then
            if [ "$STUDIO" = success ]; then
              rollback studio @commerceworker/studio || [ $? = 2 ] || failed=1
            fi
            if [ "$API" = success ]; then
              rollback api @commerceworker/api || [ $? = 2 ] || failed=1
            fi
            if [ "$MEDIA" = success ]; then
              rollback media @commerceworker/media || [ $? = 2 ] || failed=1
            fi
          fi
          # Delivery serves the catalog and, with content, binds the pipeline too: back only when
          # neither engine is stuck.
          if [ "$DELIVERY" = success ] && [ "$engine" != 1 ] && [ "$pipeline" != 1 ]; then
            rollback delivery @commerceworker/delivery || [ $? = 2 ] || failed=1
          fi
          if [ "$engine" != 1 ]; then
            rollback catalog @commerceworker/catalog || [ $? = 2 ] || failed=1
          fi
          exit "$failed"
      # Static docs Worker; independent of the app, so it goes last and can't block a deploy above
      # (the app's rollback step has already run by now, so a docs failure never rolls the app back).
      - name: Deploy docs
        id: docs
        if: fromJSON(inputs.deployment).docs
        run: retry pnpm docs:deploy
      # The docs host is the route in apps/docs/wrangler.jsonc. The home page, a reference page and
      # the OpenAPI document are served, and an unknown page is a real 404.
      - name: Smoke test docs
        id: docs-smoke
        if: fromJSON(inputs.deployment).docs
        run: |
          host=$(node -e "const {parse}=require('jsonc-parser');console.log(parse(require('fs').readFileSync('apps/docs/wrangler.jsonc','utf8')).routes[0].pattern)")
          get() { curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 "$@"; }
          get -o "$RUNNER_TEMP/docs-home.html" "https://$host/"
          grep -q "<link rel=\"canonical\" href=\"https://$host/\"" "$RUNNER_TEMP/docs-home.html"
          get -o /dev/null "https://$host/reference/rest-api/"
          get "https://$host/openapi.json" | jq -e '.openapi | startswith("3.1")' >/dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/no-such-page-${GITHUB_SHA::7}/")
          [ "$status" = 404 ] || { echo "::error::an unknown docs page answered $status, not 404"; exit 1; }
      - name: Roll back docs on a failed smoke test
        if: failure() && steps.docs.outcome == 'success'
        run: retry pnpm --filter @commerceworker/docs exec wrangler rollback -y -m "Docs smoke test failed for ${GITHUB_SHA::7}"
