name: Escrow secrets

# Encrypts a deployment's secrets to its escrow key, so losing the GitHub environment or the
# Cloudflare account doesn't lose what they protect. GitHub and Cloudflare both hold secrets
# write-only, and a job in the environment is the only thing that can read them. Run it from main
# after provisioning and after any rotation; see docs/content/backup-and-restore.md. Escrow
# `production` only: demo and bench hold nothing that can't be replaced.
#
# It refuses to run until ESCROW_RECIPIENT below is a real age public key: the owner generates one
# with `age-keygen` and pins its public half here in a reviewed change.
#
# It runs in the repository that holds the environment. A fleet kept in another repository calls it
# as a reusable workflow: the job then runs there, reads that repository's environment and uploads
# the artifact to that run, so a private fleet's escrow stays private. The definition stays here,
# beside fleet.ts, so the test that every deployed secret is escrowed keeps covering it.
#
# Nothing from the repository runs here: no checkout, so no repository code or dependency sits
# beside the secrets. Only the Encrypt step receives them, and the plaintext goes from it straight
# into age, a release pinned by digest and run with an empty environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The deployment's GitHub environment
        required: true
        type: string
      content:
        description: The deployment has the content stack on, so TOKEN_PEPPER and MEDIA_SIGNING_SECRET are required
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: The deployment's GitHub environment, in the calling repository
        required: true
        type: string
      content:
        description: The deployment has the content stack on, so TOKEN_PEPPER and MEDIA_SIGNING_SECRET are required
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  escrow:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The environment's own branch policy decides which refs may read it (production: main only).
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install age
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          url="https://github.com/FiloSottile/age/releases/download/$AGE_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" "$url/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age
          echo "$RUNNER_TEMP/age" >>"$GITHUB_PATH"
      - name: Encrypt
        env:
          # The public half of the escrow key (age1...). Pinned here, not a variable, so pointing
          # the escrow at another key takes a reviewed change. A placeholder until the owner pins one.
          ESCROW_RECIPIENT: age1-PLACEHOLDER-set-the-owner-public-key
          CONTENT: ${{ inputs.content }}
          PRINCIPAL_KEY: ${{ secrets.PRINCIPAL_KEY }}
          PRINCIPAL_KEY_PREVIOUS: ${{ secrets.PRINCIPAL_KEY_PREVIOUS }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DATA_KEY_PREVIOUS: ${{ secrets.DATA_KEY_PREVIOUS }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          SHOPIFY_SHOPS: ${{ secrets.SHOPIFY_SHOPS }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          INTAKE_ALLOWLIST: ${{ secrets.INTAKE_ALLOWLIST }}
          SHIPPING_CARRIER_AUTH: ${{ secrets.SHIPPING_CARRIER_AUTH }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APPLE_PAY_DOMAIN_ASSOCIATION: ${{ secrets.APPLE_PAY_DOMAIN_ASSOCIATION }}
          UCP_SIGNING_KEY: ${{ secrets.UCP_SIGNING_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          STREAM_WEBHOOK_SECRET: ${{ secrets.STREAM_WEBHOOK_SECRET }}
          MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${ESCROW_RECIPIENT:-}" =~ ^age1[a-z0-9]{58}$ ]]; then
            echo "::error::ESCROW_RECIPIENT in this workflow is not an age public key yet."
            echo "::error::Run 'age-keygen -o escrow.key' on a trusted machine, keep the private half outside GitHub and Cloudflare, and pin the public half (age1...) as ESCROW_RECIPIENT in .github/workflows/escrow-secrets.yml in a pull request."
            exit 1
          fi
          # The secrets a deployment can't run without must be in the escrow, or it isn't one. The
          # content stack's two are required only when the caller says it is on: this workflow has
          # no checkout, so it can't read the registry.
          required=(PRINCIPAL_KEY DATA_KEY PASSWORD_PEPPER)
          if [[ "${CONTENT:-}" == true ]]; then required+=(TOKEN_PEPPER MEDIA_SIGNING_SECRET); fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not set on this environment."
              exit 1
            fi
          done
          names=(PRINCIPAL_KEY PRINCIPAL_KEY_PREVIOUS DATA_KEY DATA_KEY_PREVIOUS SETUP_TOKEN
            SHOPIFY_WEBHOOK_SECRET SHOPIFY_SHOPS PASSWORD_PEPPER STRIPE_WEBHOOK_SECRET
            OIDC_CLIENT_SECRET TURNSTILE_SECRET_KEY INTAKE_ALLOWLIST SHIPPING_CARRIER_AUTH
            STRIPE_SECRET_KEY APPLE_PAY_DOMAIN_ASSOCIATION UCP_SIGNING_KEY TOKEN_PEPPER MEDIA_SIGNING_SECRET
            STREAM_WEBHOOK_SECRET MCP_TOKEN ADMIN_TOKEN)
          count=0
          for name in "${names[@]}"; do
            if [[ "${!name:-}" == *$'\n'* ]]; then
              echo "::error::$name holds a newline, which the NAME=value format can't restore. Set it minified (one line)."
              exit 1
            fi
            if [[ -n "${!name:-}" ]]; then count=$((count + 1)); fi
          done
          # printf is a builtin, so no value reaches a process's arguments, and `env -i` keeps the
          # values out of age's environment: it sees them only on stdin.
          age_bin=$(command -v age)
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then printf '%s=%s\n' "$name" "${!name}"; fi
          done | env -i "$age_bin" --encrypt --recipient "$ESCROW_RECIPIENT" \
            --output "$RUNNER_TEMP/escrow.age"
          # A count, not names: the run may be public, and which optional secrets are set says
          # whether a rotation is under way.
          echo "Escrowed $count secrets." >>"$GITHUB_STEP_SUMMARY"
      # Ciphertext only, but a public repository's artifacts are public too: keep it for a day at
      # most. The holder deletes it on download (docs/content/backup-and-restore.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escrow-${{ inputs.environment }}
          path: ${{ runner.temp }}/escrow.age
          if-no-files-found: error
          retention-days: 1
