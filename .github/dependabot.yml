version: 2

updates:
  # One pnpm workspace: the root lockfile and the catalog in pnpm-workspace.yaml cover every
  # package under apps/ and packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # A release waits a week before it's proposed: most hijacked packages are found and pulled
    # within days. Security updates aren't held back.
    cooldown:
      default-days: 7
    groups:
      # The AI SDK stack moves in lockstep (most of it is pinned exactly in the catalog, and
      # @cloudflare/ai-chat tracks agents), so its bumps, majors included, arrive together in
      # their own PR. Listed first: a dependency joins the first group that matches it.
      ai-sdk:
        patterns:
          - agents
          - ai
          - "@ai-sdk/*"
          - "@cloudflare/ai-chat"
          - streamdown
      # Minor and patch bumps land as one weekly PR. Majors stay one PR each so a breaking
      # change can be reviewed (and reverted) on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned: 5.0.4's module cache breaks @cloudflare/vitest-plugin (see AGENTS.md).
      - dependency-name: vitest

  # The workflows, and the composite actions in .github/actions/ (each listed: Dependabot reads
  # only .github/workflows/ from `/`).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
